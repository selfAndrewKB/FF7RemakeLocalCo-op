; LocalSplitScreen (FF7 Remake): the mod's settings. Read once when the game starts. Lives in the mod's folder
; (<game>/End/Binaries/Win64/ue4ss/Mods/LocalSplitScreen/LocalSplitScreen.ini); the console switches change
; everything at run time (tools/game.py shell).

[Views]
; multi-monitor = off | on | auto
;   auto  the game window spans a row of equal monitors while player 2 is in: one full view per player (the default)
;   on    the span from the start, kept whatever the player count: the title, loading screens, the field and the
;         menus show on every monitor of the row (the empty column mirrors player 1's picture until player 2 joins)
;   off   no span at the start (window-span on, window-span.hold on and Ctrl+F2 still work)
multi-monitor = auto

; column-order = 1 2 3 | 1 3 2
;   which screen players 2 and 3 take when three views show (the console's column-order 123 | 132 changes it in play)
;   1 2 3  the join order (the default): the player who joined first takes the middle, the next the right
;   1 3 2  player 2 always on the right, player 3 in the middle (in one window: bottom right and bottom left);
;          player 1 keeps the left (the top); a screen with no player shows the mirror view
column-order = 1 2 3

[Battle]
; menu-slow = on | off
;   on   an open battle command menu slows the world almost to a stop and greys the screen, as the game does (the
;        default); with several players any player's open menu slows and greys everyone
;   off  no grey, and the world and the ATB gauges run on at full speed while a menu is open (the menu still mutes rumble, and
;        enemies may still wait on player 1's menu); Ctrl+F9 and the console's menu-slow on|off switch it in play
menu-slow = on

; battle-warps = players-stay | off | game
;   who the game warps when a battle starts (next to the leader) and ends (back to the leader when far)
;   players-stay  every player's own character stays where its player left it; the members no player controls are
;                 warped as the game does (the default); a character revived outside the battle area is still brought
;                 back, as the game does
;   off           nobody is warped (a far member no player controls may not reach the fight)
;   game          the game's warps for the whole party
battle-warps = players-stay
