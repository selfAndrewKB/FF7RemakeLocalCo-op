; LocalSplitScreen (FF7 Remake): the mod's settings. Read once when the game starts. Lives in the mod's folder
; (<game>/End/Binaries/Win64/ue4ss/Mods/LocalSplitScreen/LocalSplitScreen.ini); the console switches change
; everything at run time (tools/game.py shell), and every option here is a console command of the same name. A
; value's case, spaces and commas do not matter; a value that is none of the words is a warning and the default.

[Views]
; multi-monitor = off | on | auto  (the console's multi-monitor auto|on|off switches it in play)
;   auto  the game window spans a row of equal monitors while player 2 is in: one full view per player (the default)
;   on    the span from the start, kept whatever the player count: the title, loading screens, the field and the
;         menus show on every monitor of the row (the empty column mirrors player 1's picture until player 2 joins)
;   off   no span at the start (window-span on, window-span.hold on and Ctrl+F2 still work)
multi-monitor = auto

; column-order = 1 2 3 | 1 3 2
;   which screen players 2 and 3 take when three views show (the console's column-order 123 | 132 changes it in play)
;   1 2 3  the join order (the default): the player who joined first takes the middle, the next the right
;   1 3 2  player 2 always on the right, player 3 in the middle (in one window: bottom right and bottom left);
;          player 1 keeps the left (the top); a screen with no player shows the mirror view
column-order = 1 2 3

[Battle]
; menu-slow = on | off
;   off  no grey, and the world and the ATB gauges run on at full speed while a menu is open (the default; the menu
;        still mutes rumble, and a summon may still wait on player 1's menu)
;   on   an open battle command menu slows the world almost to a stop and greys the screen, as the game does; with
;        several players any player's open menu slows and greys everyone
;   Ctrl+F9 and the console's menu-slow on|off switch it in play
menu-slow = off

; battle-warps = players-stay | off | game  (the console's battle-warps switches it in play)
;   who the game warps when a battle starts (next to the leader) and ends (back to the leader when far)
;   players-stay  every player's own character stays where its player left it; the members no player controls are
;                 warped as the game does (the default); a character revived outside the battle area is still brought
;                 back, as the game does
;   off           nobody is warped (a far member no player controls may not reach the fight)
;   game          the game's warps for the whole party
battle-warps = players-stay

; The battle's rates, each a multiplier from 0.1 to 10.0 in steps of 0.1, written 1.5 (1.0, the default: the game's own).
; The console's command of the same name and the Co-op page switch each in play.
; enemy-damage   the damage enemies deal to the party (from the next hit; the game's 9999 cap stays)
; enemy-hp       every enemy's max HP but the bosses'
; boss-hp        the max HP of bosses, summon bosses and named foes (the enemies the game marks as a fight's leader)
; enemy-stagger  the size of every enemy's stagger gauge (higher: enemies stagger later)
;   a new HP or gauge rate takes effect from the next fight
; exp-gain       the EXP a won battle gives (on top of the game's 2x EXP option and its post-story bonus)
; ap-gain        the AP a won battle gives (on top of the game's 3x AP)
enemy-damage = 1.0
enemy-hp = 1.0
boss-hp = 1.0
enemy-stagger = 1.0
exp-gain = 1.0
ap-gain = 1.0

[Experimental]
; Options still being tried: off (the game's own way) by default.
; lead-holder = guide | keeps  (the console's lead-holder switches it in play)
;   when the level walks player 2's or player 3's character ahead (Tifa's or Aerith's leads) and needs the walk finished
;   guide  the character walks it on its AI, its player's view following it (the default)
;   keeps  its player keeps control; the next stop is marked with the main-objective diamond and a pin on that player's
;          minimap only, and the character's AI finishes the arrival within 2 m of the stop, then hands back
lead-holder = guide
